# fly.toml app configuration file generated for rag-api-server on 2026-02-23T18:31:52+11:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rag-api-server'
primary_region = 'nrt'

[build]

[[mounts]]
  source = 'rag_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
